<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee promo tile</title>
<style>
body { margin: 0; }
:root { --bg:#161514; --surface:#1f1d1b; --ink:#f5f5f4; --muted:#a8a29e; --line:#3a3633; --accent:#93c5fd; --soft:#1e3a8a }
</style>
</head>
<body>
<div style="position: relative; width: 1400px; height: 560px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <svg aria-hidden="true" width="1400" height="560" viewBox="0 0 1400 560" style="position: absolute; left: 0; top: 0"><path d="M560 560C530 450 600 340 750 300C950 245 1190 250 1400 130V560Z" fill="var(--soft)" opacity="0.55"></path></svg>

  <div style="position: absolute; left: 72px; top: 124px; width: 520px; display: flex; flex-direction: column; gap: 16px">
    <svg role="img" aria-label="EVM RPC Inspector icon" width="88" height="88" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#4f46e5"></rect><g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M42 26c-10 0-12 6-12 14v12c0 6-4 12-10 12 6 0 10 6 10 12v12c0 8 2 14 12 14"></path><path d="M86 26c10 0 12 6 12 14v12c0 6 4 12 10 12-6 0-10 6-10 12v12c0 8-2 14-12 14"></path></g><path d="M64 36l15 28-15 28-15-28z" fill="#fff"></path></svg>
    <h1 style="margin: 8px 0 0; font-size: 56px; line-height: 62px; font-weight: 650; letter-spacing: -0.02em">EVM RPC Inspector</h1>
    <p style="margin: 0; font-size: 28px; line-height: 38px; font-weight: 400; color: var(--muted)">Every JSON-RPC call of your dApp, decoded in Chrome DevTools</p>
  </div>

  <div style="position: absolute; left: 700px; top: 64px; width: 628px; height: 432px; box-sizing: border-box; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 20px; line-height: 28px">
    <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 150px; gap: 16px; padding: 4px 8px 12px; font-weight: 600; border-bottom: 1px solid var(--line)">
      <div>Method</div><div>Contract</div><div>Function</div>
    </div>
      <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 150px; gap: 16px; padding: 12px 8px; border-bottom: 1px solid var(--line); color: var(--muted)">
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px">eth_chainId</div><div></div><div></div>
      </div>
      <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 150px; gap: 16px; padding: 12px 8px; border-bottom: 1px solid var(--line); color: var(--muted)">
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px">eth_call</div><div>Vyper_contract</div><div>admin</div>
      </div>
    <div style="height: 92px"></div>
      <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 150px; gap: 16px; padding: 12px 8px; border-bottom: 1px solid var(--line); color: var(--muted)">
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px">eth_chainId</div><div></div><div></div>
      </div>
      <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 150px; gap: 16px; padding: 12px 8px; border-bottom: 1px solid var(--line); color: var(--muted)">
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px">eth_feeHistory</div><div></div><div></div>
      </div>
  </div>

  <div style="position: absolute; left: 668px; top: 235px; width: 692px; height: 100px; box-sizing: border-box; padding: 0 32px; display: grid; grid-template-columns: 150px 210px minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface); border: 2px solid var(--accent); border-radius: 8px; font-size: 24px; line-height: 32px">
    <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 22px; font-weight: 500">eth_call</div>
    <div style="font-weight: 600">CurveFactory</div>
    <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px">gauge_implementation</div>
  </div>
</div>
</body>
</html>
