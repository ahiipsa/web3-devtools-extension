<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decode calls and results</title>
<style>
body { margin: 0; }
:root { --bg:#161514; --surface:#1f1d1b; --ink:#f5f5f4; --muted:#a8a29e; --line:#3a3633; --accent:#93c5fd; --soft:#1e3a8a }
</style>
</head>
<body>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <svg aria-hidden="true" width="1280" height="800" viewBox="0 0 1280 800" style="position: absolute; left: 0; top: 0"><path d="M0 170C190 90 350 170 410 320C470 480 510 650 570 800H0Z" fill="var(--soft)" opacity="0.55"></path></svg>

  <div style="position: absolute; left: 72px; top: 256px; width: 420px; display: flex; flex-direction: column; gap: 16px">
    <svg aria-hidden="true" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4a2 2 0 0 0 -2 2v3a2 3 0 0 1 -2 3a2 3 0 0 1 2 3v3a2 2 0 0 0 2 2"></path><path d="M17 4a2 2 0 0 1 2 2v3a2 3 0 0 0 2 3a2 3 0 0 0 -2 3v3a2 2 0 0 1 -2 2"></path></svg>
    <h1 style="margin: 0; font-size: 76px; line-height: 84px; font-weight: 650; letter-spacing: -0.02em">Decode</h1>
    <p style="margin: 0; font-size: 34px; line-height: 44px; font-weight: 400; color: var(--muted)">Hex into functions and return values</p>
  </div>

  <div style="position: absolute; left: 560px; top: 96px; width: 648px; height: 608px; box-sizing: border-box; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 22px; line-height: 32px">
    <div style="font-size: 28px; line-height: 36px; font-weight: 600; margin-bottom: 24px">Overview</div>
      <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line)">
        <div style="color: var(--muted)">Method</div>
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 20px; font-weight: 500">eth_call</div>
      </div>
      <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line)">
        <div style="color: var(--muted)">Contract</div>
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 20px; font-weight: 500">CurveFactory</div>
      </div>
      <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line)">
        <div style="color: var(--muted)">Function</div>
        <div style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 20px; font-weight: 500">gauge_implementation</div>
      </div>
    <div style="height: 180px"></div>
    <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line)">
      <div style="color: var(--muted)">Status</div><div>ok</div>
    </div>
  </div>

  <div style="position: absolute; left: 520px; top: 368px; width: 728px; height: 152px; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; justify-content: center; gap: 12px; background: var(--surface); border: 2px solid var(--accent); border-radius: 8px">
    <div style="font-size: 26px; line-height: 34px; font-weight: 600">Decoded return value</div>
    <div style="display: flex; gap: 16px; align-items: baseline; font-size: 22px; line-height: 32px">
      <span style="color: var(--muted)">address</span>
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 22px; font-weight: 500">0xdc89…36E5</span>
    </div>
  </div>
</div>
</body>
</html>
